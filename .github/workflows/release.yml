# Release: on a version tag, run presubmit, build the binary natively for each supported
# target, self-test it, and publish tarballs with BLAKE3 and SHA-256 sums to a GitHub release.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  presubmit:
    uses: ./.github/workflows/presubmit.yml

  build:
    name: build ${{ matrix.target }}
    needs: presubmit
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain
      - run: cargo build --release --locked -p cafetensor-bin
      - name: self-test
        run: ./target/release/cafetensor
      - name: package
        run: |
          name="cafetensor-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp target/release/cafetensor cafetensor-lib/README.md DECISIONS.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          ./target/release/cafetensor b3sum "dist/$name.tar.gz" 2>/dev/null > "dist/$name.tar.gz.b3"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz*

  publish:
    name: publish
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
